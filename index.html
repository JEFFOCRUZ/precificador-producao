<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Precificador de Produção 3D | Bobinou Maker Store</title>
<style>
html,body{margin:0;width:100%;height:100%;background:linear-gradient(180deg,#fff 0,#f3f5f8 100%);font-family:Inter,Segoe UI,Arial,sans-serif}
.loader{position:fixed;inset:0;display:grid;place-items:center;color:#18202b;background:linear-gradient(180deg,#fff 0,#f3f5f8 100%);z-index:2}
.loader-card{max-width:520px;margin:24px;padding:28px;border:1px solid #e3e7ee;border-radius:18px;background:#fff;text-align:center;box-shadow:0 14px 34px rgba(16,24,40,.08)}
.loader-card h1{margin:0 0 10px;color:#111827;font-size:24px}.loader-card p{margin:0;color:#667085;line-height:1.55}
iframe{display:block;width:100%;height:100%;border:0;background:#f6f7f9}
</style>
</head>
<body>
<div class="loader" id="loader">
  <div class="loader-card">
    <h1>Precificador de Produção 3D</h1>
    <p>Carregando o precificador completo com visual claro e profissional.</p>
  </div>
</div>
<iframe id="precificadorFrame" title="Precificador de Produção 3D" src="profissional.html"></iframe>
<script>
(function(){
  const frame=document.getElementById('precificadorFrame');
  const loader=document.getElementById('loader');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      const win=frame.contentWindow;
      if(doc&&!doc.getElementById('professional-light-refresh-link')){
        const link=doc.createElement('link');
        link.id='professional-light-refresh-link';
        link.rel='stylesheet';
        link.href='layout-refresh.css';
        doc.head.appendChild(link);
      }
      if(doc) doc.documentElement.style.background='#f6f7f9';
      if(doc&&win) setupQuoteDarkColor(doc,win);
    }catch(e){}
    if(loader) loader.style.display='none';
  });

  function setupQuoteDarkColor(doc,win){
    if(doc.getElementById('corOrcamentoEscura')) return;

    const customField=doc.getElementById('corOrcamentoCustom')?.closest('.field');
    if(customField){
      const field=doc.createElement('div');
      field.className='field';
      field.innerHTML='<label>Cor escura do orçamento</label><input id="corOrcamentoEscura" type="color" value="#202733" style="padding:4px;height:46px;"><div class="hint">Muda a cor das áreas escuras da prévia e do PDF.</div>';
      customField.insertAdjacentElement('afterend',field);
    }

    const input=doc.getElementById('corOrcamentoEscura');
    const saved=win.localStorage.getItem('corOrcamentoEscura');
    if(input&&saved) input.value=saved;

    win.obterCorOrcamentoEscuraHex=function(){
      return doc.getElementById('corOrcamentoEscura')?.value || '#202733';
    };
    win.aplicarCorEscuraPreview=function(){
      const cor=win.obterCorOrcamentoEscuraHex();
      const preview=doc.getElementById('quotePreview');
      if(preview) preview.style.setProperty('--orc-dark',cor);
      win.localStorage.setItem('corOrcamentoEscura',cor);
    };

    input?.addEventListener('input',win.aplicarCorEscuraPreview);
    input?.addEventListener('change',win.aplicarCorEscuraPreview);
    win.aplicarCorEscuraPreview();

    if(typeof win.gerarPreviewOrcamento==='function'&&!win.gerarPreviewOrcamento.__darkColorPatched){
      const originalPreview=win.gerarPreviewOrcamento;
      win.gerarPreviewOrcamento=function(){
        const result=originalPreview.apply(this,arguments);
        win.aplicarCorEscuraPreview();
        return result;
      };
      win.gerarPreviewOrcamento.__darkColorPatched=true;
    }

    const pdfButton=[...doc.querySelectorAll('button')].find(button => button.textContent.trim()==='Gerar PDF');
    if(pdfButton&&!pdfButton.dataset.darkColorPrint){
      pdfButton.dataset.darkColorPrint='true';
      pdfButton.setAttribute('onclick','gerarPreviewOrcamento(); setTimeout(function(){ window.print(); }, 120);');
    }
  }
})();
</script>
</body>
</html>
